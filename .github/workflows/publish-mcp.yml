name: Publish to MCP Registry

# Two ways to run this:
#
# 1. Push a version tag (v0.4.1). Publishes to npm, then to the MCP Registry.
#    Needs an NPM_TOKEN repository secret.
# 2. Run it manually from the Actions tab. Skips npm entirely and only
#    publishes to the MCP Registry, which needs no secret at all because
#    mcp-publisher authenticates with GitHub OIDC. Use this if the npm
#    package was already published by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Also publish the package to npm (requires NPM_TOKEN secret)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC auth to the MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      # server.json and package.json must agree on the version, or the
      # registry rejects the publish. Fail loudly here rather than at the end.
      - name: Check version agreement
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          PKGREF=$(node -p "require('./server.json').packages[0].version")
          echo "package.json=$PKG server.json=$SRV packages[0]=$PKGREF"
          test "$PKG" = "$SRV" && test "$PKG" = "$PKGREF"

      - name: Publish package to npm
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
